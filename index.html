if(page==='browse'){out=head('住店旅行助手','sms')+hero(mode==='near'?'走出酒店，<br>好去处就在附近。':'来一趟珠海，<br>留点时间给这座城。',hotel+' · 11.18—11.20')+`<div class="tabs"><button class="${mode==='near'?'active':''}" onclick="browse('near')"><b>附近吃逛</b><small>近一点，轻松一点</small></button><button class="${mode==='city'?'active':''}" onclick="browse('city')"><b>当地必体验</b><small>有特色，值得专程</small></button></div><button class="quick" onclick="go('plan')"><b>我有半天，帮我排一排</b><br><small>把吃饭、游玩和返程接起来　›</small></button><div class="chips">${(mode==='near'?['全部','美食','景点','商场']:['全部','美食','景点','活动']).map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div class="muted">${mode==='near'?'以酒店为参考点 · 步行优先':'全城推荐 · 已标注从酒店出发的路程'}</div>`;out+=items.map((a,i)=>({a,i})).filter(({a})=>(mode==='city'||a.near)&&(cat==='全部'||a.type===cat)).map(({a,i})=>card(a,i)).join('')+footer();}
if(page==='detail'){out=head(x.name)+`<div class="cover" style="height:165px;border-radius:18px">${art(x.art)}<span class="badge">${x.type} · 示例内容</span></div><h2 style="margin-top:16px">${x.name}</h2><p>${x.desc}</p><div class="panel"><div class="row"><b>${x.cost}</b><span class="tag">${x.rule}</span></div><p class="meta">从酒店 ${x.travel}</p><p class="meta">${x.time} · 路程和开放规则均为模拟</p></div>`;
if(['food','reserve','paid'].includes(x.kind))out+=`<button class="primary wide" onclick="go('book')">${x.kind==='food'?'帮我订餐厅':x.kind==='paid'?'查日期与票种':'查可预约时段'} ›</button>`;
if(x.kind==='event')out+='<div class="banner">虚构活动：11月18日 15:00–20:00。仅演示与入住日期匹配，不提供真实报名。</div>';
out+=`<button class="secondary wide" onclick="mapIsRoute=false;go('map')">看酒店到这里怎么去</button>`;if(x.art==='sea')out+=`<div class="panel"><b>想在这里拍点好看的？</b><p class="muted">看看构图参考、穿搭和随身准备</p><button class="link" onclick="go('style')">看拍照与穿搭建议 ›</button></div>`;out+='<p class="note">实际营业、预约要求及交通需接入可信实时来源核验。</p>';}
if(page==='book'){let opts=bookingOptions(),paid=x.kind==='paid';out=head(x.kind==='food'?'预订餐厅':paid?'选择门票':'免费预约','detail')+`<h2>${x.name}</h2><div class="panel fields grid2"><label>使用日期<select onchange="day=this.value;render()">${['2026-11-18','2026-11-19','2026-11-20'].map(d=>`<option ${day===d?'selected':''}>${d}</option>`).join('')}</select></label><label>${paid?'成人数':'人数'}<select onchange="people=Number(this.value);render()">${[1,2,3,4].map(n=>`<option ${n===people?'selected':''}>${n}</option>`).join('')}</select></label></div>`;if(day==='2026-11-19')out+='<div class="banner">该日期暂无模拟可订余量，请换个日期。不会自动换日期或下单。</div>';else{out+=`<div class="panel"><b>${paid?'可选票种':'可选时段'} · 模拟</b>${opts.map((o,i)=>`<button class="option ${(paid?ticket:slot)===i?'selected':''}" onclick="${paid?'ticket':'slot'}=${i};render()">${o}${paid?' · ¥'+(i?428:348)+'/人':''}${paid&&!i?' · 基础游玩优先推荐':''}</button>`).join('')}<p class="muted">${paid?(ticket?'模拟包含：一日入园＋餐饮券。确认后不可退。':'模拟包含：一日入园，不含餐。游玩前一日18:00前可退。'):x.kind==='food'?'模拟规则：订座不预付，餐费到店结算；可在用餐前取消。':'模拟规则：按时段入场，需在官方渠道填写实名信息。'}</p>${paid?'<h3 class="price">合计 ¥'+total()+'</h3>':''}</div><button class="primary wide" onclick="go('review')">下一步，核对预订条件</button>`;}out+='<p class="note">无真实库存或价格；不收集姓名、证件和支付信息。</p>';}
if(page==='review'){out=head('请确认后再交接','book')+`<h2>这次帮你订这些</h2><div class="panel"><h3>${x.name}</h3><p>${day} · ${people} 位成人</p><p>${bookingOptions()[x.kind==='paid'?ticket:slot]}</p><p class="price">${x.kind==='paid'?'总价 ¥'+total():x.kind==='food'?'订座 ¥0 · 餐费到店结算':'免费预约'}</p></div><div class="banner">这是模拟交接，不会发起真实预订或扣款。实际服务需在官方渠道补充必要信息并确认，付款也应在可信渠道完成。</div><button class="primary wide" onclick="saveBooking()">确认，模拟交给官方渠道</button>`;}
if(page==='receipt'){out=head('交接结果','orders')+'<div class="success">✓</div><h2 class="center">已生成模拟交接记录</h2><p class="center muted">不是预订成功凭证</p>'+`<div class="panel"><b>${x.name}</b><p>${day} · ${people} 人</p><p>${bookingOptions()[x.kind==='paid'?ticket:slot]}</p></div><div class="banner">真实接入后，需要收到官方确认回执，才能显示「预约成功」。本 Demo 未下单、未预约、未支付。</div><button class="primary wide" onclick="go('orders')">查看模拟预约记录</button><button class="secondary wide" onclick="browse('city')">继续探索这座城</button>`;}
if(page==='orders'){out=head('我的预约记录')+'<h2>旅途中，少翻几次消息。</h2><p class="muted">仅本次打开页面期间保存，刷新即清空。</p>'+(bookings.length?bookings.map(b=>`<div class="panel"><span class="tag">待官方确认 · 模拟</span><h3>${b.name}</h3><p>${b.day} · ${b.people} 人</p><p>${b.choice}</p><small class="muted">${b.price?'模拟合计 ¥'+b.price:'未支付 · 交接演示'}</small></div>`).join(''):'<div class="panel">还没有记录。可以去餐厅订座或景点选票体验。</div>')+footer();}
if(page==='plan'){let r=route(),[h,m]=start.split(':').map(Number),base=h*60+m;out=head('按时间帮我排')+'<div class="eyebrow">酒店出发 / 酒店返回</div><h2>不赶路，也能吃好逛好。</h2><div class="panel fields grid2"><label>出发时间<input type="time" value="'+start+'" onchange="if(this.value){start=this.value;render()}"></label><label>我有多长时间<select onchange="duration=Number(this.value);render()"><option value="120" '+(duration===120?'selected':'')+'>2 小时 · 轻松走走</option><option value="240" '+(duration===240?'selected':'')+'>4 小时 · 吃逛半天</option></select></label></div>'+(r.length?'<div class="panel">'+r.map(a=>`<div class="step"><b>${time(base+a[0])}　${a[1]}</b><small>${a[2]}</small></div>`).join('')+'</div><div class="banner">按模拟步行与停留时间安排，已计入返程。不保证真实营业或路况。</div>'+`<button class="primary wide" onclick="id=1;mapIsRoute=true;go('map')">把这段路线交给地图</button>${duration===240?'<button class="secondary wide" onclick="openItem(0);go(\'book\')">顺手订好茶记座位</button>':''}<button class="secondary wide" onclick="go('style')">这条路线怎么拍、怎么穿？</button>`:'<div class="banner">当前时段不适合这条演示路线，试试09:00之后、晚间21:00前能返回的时间。不会硬排已闭店的行程。</div>')+footer();}
if(page==='map'){out=head('出行交接',mapIsRoute?'plan':'detail')+'<h2>路程看清楚，再出发。</h2>'+mapSvg()+`<div class="panel"><small class="muted">参考起点（不是实时定位）</small><p><b>${hotel}</b></p><small class="muted">目的地</small><p><b>${mapIsRoute?(duration===240?'海边 → 商场 → 茶记 → 酒店':'海边 → 酒店'):x.name}</b></p></div><div class="panel"><div class="row"><b>${mapIsRoute?'步行多站路线 · 含返程':x.travel}</b><span class="tag">模拟交通</span></div><p class="muted">${page==='map'?'路线和费用应以地图实时结果为准。':''}</p></div><button class="primary wide" onclick="go('mapReady')">预览地图接收的行程</button>`;}
if(page==='mapReady'){let r=route();out=head('地图交接预览','map')+'<h2>起终点已准备好</h2><div class="panel"><div class="step"><b>'+hotel+'</b><small>出发</small></div>'+`${(mapIsRoute?(duration===240?['情侣路海边段','海岸生活广场','海巷茶记',hotel]:['情侣路海边段',hotel]):[x.name]).map(n=>'<div class="step"><b>'+n+'</b><small>已选站点 · 模拟</small></div>').join('')}</div><div class="banner">未启动真实地图，也未发起叫车。实际接入后将携带已选地点交接，路线和费用由地图实时计算。</div>`;}
if(page==='style'){out=head('拍照与穿搭', 'plan')+`<div class="cover" style="height:160px;border-radius:20px">${art('sea')}</div><h2 style="margin-top:15px">去海边，轻松一点就很好看。</h2><div class="panel"><span class="tag">情侣路海边路线 · 示例</span><h3>把海留在画面里</h3><p class="muted">站在公开步道内，让海面占画面一半；同行者稍退后，拍一张人物与海岸线。不翻越护栏，不占用通道。</p><p class="muted">可关注日落前的柔和光线，具体日落与天气需实时查询，不保证当天效果。</p></div><div class="panel"><h3>用已有衣服，搭一个海岸配色</h3><div class="swatches"><span style="background:#f0e7d5"></span><span style="background:#9bbfc0"></span><span style="background:#7d866d"></span></div><p>米白上衣＋浅蓝或卡其下装，搭适合步行的鞋。海风大时可带薄外套。</p><p class="muted">当前未查询真实天气，不据此判断当天温度或紫外线。</p></div><div class="panel"><b>出门前，看看包里有没有</b><p class="muted">帽子、墨镜、饮水；已有就不用再买。</p><button class="link" onclick="go('shop')">确实缺一件？看看怎么补齐 ›</button></div>`;}
if(page==='shop'){out=head('按需补齐，不必买新','style')+'<h2>缺了再找，来得及才推荐。</h2><div class="banner">不是必备购物清单，也不是商业广告。商品、价格、门店与可达性均为虚构样例。</div><div class="chips">'+['附近购买','送到酒店'].map(v=>`<button class="${shopMode===v?'active':''}" onclick="shopMode='${v}';render()">${v}</button>`).join('')+'</div>'+(shopMode==='附近购买'?'<div class="panel"><div class="product"><div class="product-icon">帽</div><div><b>基础遮阳帽</b><p class="muted">模拟 ¥59 · 海岸生活广场</p></div></div><div class="product"><div class="product-icon">镜</div><div><b>日常太阳镜</b><p class="muted">模拟 ¥99 · 海岸生活广场</p></div></div><p class="muted">先核对门店营业、商品标识和库存，再决定是否前往。</p><button class="secondary wide" onclick="openItem(2)">看看商场怎么去</button></div>':'<div class="panel"><b>暂不推荐配送商品</b><p class="muted">未接入配送，不能确认出发前能送达，也不会因为已知酒店就自动填入收货地址。</p></div>')+'<button class="primary wide" onclick="go(\'style\')">已有这些，返回行程准备</button>';}
document.getElementById('screen').innerHTML=out;}
render();
</script></body></html>
